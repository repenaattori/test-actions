name: Harjoitus 1
on: 
  issues:
    types: opened
  workflow_dispatch:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: filecreation
        run: |
          touch info.txt
          echo "Hellow world" > info.txt
      - name: backup
        run: |
          mkdir backup
          cp info.txt backup/info.txt
      - name: contents
        run: |
          ls -al
          ls -al backup
          cat info.txt
  yesno:
    runs-on: ubuntu-latest
    steps:
      - run: curl https://yesno.wtf/api 

